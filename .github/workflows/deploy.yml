name: Deploy

# Builds with Eleventy + Pagefind and publishes to S3 behind CloudFront (infra/,
# scripts/deploy-aws.mjs). GitHub Pages served the site until the DNS moved to
# CloudFront on 2026-10-26. The episode audio is not in the build: it is in its
# own bucket already, and the deploy checks that every enclosure is there.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the sitemap's <lastmod> is each page's last commit
          # (src/_data/edited.js), and a shallow clone has only one.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit dependencies (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          retention-days: 7

  # Publishes the tested build: the files that changed, the redirect map into CloudFront's key
  # value store, the cache cleared, then the result read back through the distribution.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v7
        with:
          name: site
          path: _site

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Publish to S3 and CloudFront
        run: npm run deploy:aws
        env:
          SYNC_RECEIVED_BUS: ${{ vars.SYNC_RECEIVED_BUS }}
